<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temporal · Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            ink: {
              50:  '#f6f7f9',
              100: '#eceef2',
              200: '#d6dae3',
              300: '#b1b8c7',
              400: '#7d869c',
              500: '#525c75',
              600: '#3a4358',
              700: '#2a3145',
              800: '#1c2235',
              900: '#0f1422',
            },
            accent: {
              500: '#6366f1',
              600: '#4f46e5',
            },
          },
          boxShadow: {
            'soft': '0 1px 2px rgba(15, 20, 34, 0.04), 0 1px 3px rgba(15, 20, 34, 0.06)',
            'lift': '0 4px 12px -2px rgba(15, 20, 34, 0.08), 0 2px 4px -2px rgba(15, 20, 34, 0.06)',
          },
          keyframes: {
            'pulse-dot': {
              '0%, 100%': { opacity: 1, transform: 'scale(1)' },
              '50%':      { opacity: 0.55, transform: 'scale(0.85)' },
            },
            'fade-in': {
              '0%': { opacity: 0, transform: 'translateY(2px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
          },
          animation: {
            'pulse-dot': 'pulse-dot 1.6s ease-in-out infinite',
            'fade-in':  'fade-in 180ms ease-out both',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html { scroll-behavior: smooth; }
    body {
      background:
        radial-gradient(1200px 600px at 0% -10%, rgba(99,102,241,0.08), transparent 60%),
        radial-gradient(900px 500px at 100% -10%, rgba(16,185,129,0.06), transparent 60%),
        #f6f7f9;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    /* Subtle scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #d6dae3; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #b1b8c7; background-clip: content-box; }
    .toggle.on { background: linear-gradient(135deg, #4f46e5, #6366f1); border-color: transparent; }
    .toggle.on::after { transform: translateX(16px); }
  </style>
  <style type="text/tailwindcss">
    @layer components {
      .field {
        @apply h-9 px-3 rounded-lg border border-ink-200 bg-white text-sm text-ink-800 placeholder-ink-400
               focus:outline-none focus:ring-2 focus:ring-accent-500/30 focus:border-accent-500/60 transition;
      }
      .btn {
        @apply h-9 px-3 inline-flex items-center justify-center gap-1.5 rounded-lg text-sm font-medium transition
               focus:outline-none focus:ring-2 focus:ring-accent-500/30;
      }
      .btn-primary { @apply btn bg-ink-900 text-white hover:bg-ink-800 active:bg-ink-700; }
      .btn-ghost   { @apply btn bg-white text-ink-700 border border-ink-200 hover:bg-ink-50; }
      .btn-danger  { @apply btn bg-white text-rose-700 border border-rose-200 hover:bg-rose-50; }
      .chip {
        @apply inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium tracking-wide uppercase;
      }
      .card {
        @apply bg-white rounded-xl border border-ink-100 shadow-soft hover:shadow-lift transition;
      }
      .toggle {
        @apply relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border border-ink-200 bg-ink-100
               transition-colors focus-within:ring-2 focus-within:ring-accent-500/30;
      }
      .toggle input { @apply sr-only; }
      .toggle::after {
        content: '';
        @apply absolute top-0.5 left-0.5 h-4 w-4 rounded-full bg-white shadow transition-transform;
      }
    }
  </style>
</head>
<body class="text-ink-800 antialiased">
  <header class="sticky top-0 z-20 bg-white/75 backdrop-blur-md border-b border-ink-100">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 space-y-3">
      <div class="flex flex-col lg:flex-row lg:items-center gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="relative inline-flex">
            <span class="absolute inset-0 rounded-full bg-emerald-500/40 animate-pulse-dot"></span>
            <span class="relative inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          </span>
          <h1 class="text-base sm:text-lg font-semibold tracking-tight text-ink-900">Temporal Logs</h1>
          <span id="live-badge" class="chip bg-emerald-50 text-emerald-700 border border-emerald-100 hidden">Live</span>
        </div>

        <div class="flex flex-1 flex-wrap items-center gap-2 lg:justify-end">
          <div class="relative flex-1 min-w-[14ch] max-w-md">
            <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-ink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="filter-q" type="search" placeholder="Search title…" class="field pl-8 w-full" />
          </div>

          <label class="flex items-center gap-2 text-sm">
            <span class="text-ink-500">Type</span>
            <select id="filter-type" class="field"><option value="">All</option></select>
          </label>

          <label class="flex items-center gap-2 text-sm">
            <span class="text-ink-500">Per page</span>
            <select id="filter-size" class="field">
              <option>20</option>
              <option selected>50</option>
              <option>100</option>
              <option>200</option>
            </select>
          </label>

          <label class="flex items-center gap-2 text-sm pl-1 select-none cursor-pointer" title="Auto-refresh every 5 seconds">
            <span id="auto-toggle" class="toggle on">
              <input id="auto-refresh" type="checkbox" checked />
            </span>
            <span class="text-ink-600">Auto-refresh <span class="mono text-ink-400">5s</span></span>
          </label>

          <button id="refresh" class="btn-primary" title="Refresh now">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
            Refresh
          </button>
          <button id="export-csv" class="btn-ghost" title="Export filtered results as CSV">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
            Export CSV
          </button>
          <button id="clear" class="btn-danger" title="Delete entries">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            Delete all
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    <div class="flex items-center justify-between mb-4">
      <div id="meta" class="text-xs text-ink-500"></div>
      <div id="status" class="text-xs text-ink-400 mono"></div>
    </div>

    <ul id="entries" class="space-y-3"></ul>

    <div id="empty" class="hidden text-center py-16">
      <div class="inline-flex flex-col items-center gap-2 text-ink-400">
        <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
        <div class="text-sm text-ink-500">No log entries match.</div>
      </div>
    </div>

    <nav class="mt-8 flex items-center justify-center gap-1.5" id="pager"></nav>
  </main>

  <script>
    const state = { page: 1, size: 50, type: "", q: "" };
    const REFRESH_MS = 5000;
    let timer = null;
    let qTimer = null;
    let inflight = 0;

    const $ = (sel) => document.querySelector(sel);

    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function badgeClass(type) {
      const palette = [
        "bg-sky-50 text-sky-700 border-sky-100",
        "bg-violet-50 text-violet-700 border-violet-100",
        "bg-emerald-50 text-emerald-700 border-emerald-100",
        "bg-amber-50 text-amber-800 border-amber-100",
        "bg-rose-50 text-rose-700 border-rose-100",
        "bg-ink-100 text-ink-700 border-ink-200",
      ];
      let h = 0;
      for (const c of String(type)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return palette[h % palette.length];
    }

    function formatTimestamp(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      if (isNaN(d.getTime())) return ts;
      const date = d.toISOString().slice(0, 10);
      const time = d.toTimeString().slice(0, 8);
      const ms   = String(d.getMilliseconds()).padStart(3, "0");
      return `${date} ${time}.${ms}`;
    }

    // rendered: id -> { el, sig } — keyed cache for diff-based rendering.
    // Without this, every refresh wipes the list and rebuilds it, which makes
    // the page flicker and replays the fade-in animation on every entry.
    const rendered = new Map();

    function entrySignature(e) {
      const messages = Array.isArray(e.message) ? e.message : (e.message ? [e.message] : []);
      return JSON.stringify([e.timestamp, e.type, e.title, messages]);
    }

    function buildEntryEl(e) {
      const li = document.createElement("li");
      li.className = "card p-4 sm:p-5 relative group animate-fade-in";
      const messages = Array.isArray(e.message) ? e.message : (e.message ? [e.message] : []);
      const messagesHTML = messages.length
        ? `<ul class="text-sm text-ink-700 mt-2 space-y-1 pl-4 border-l-2 border-ink-100">${
            messages.map((m) => `<li class="whitespace-pre-wrap break-words mono leading-relaxed">${escapeHTML(m)}</li>`).join("")
          }</ul>`
        : "";
      const idAttr = e.id ? ` data-id="${escapeHTML(e.id)}"` : "";
      const badge  = badgeClass(e.type);
      li.innerHTML = `
        <button class="entry-delete absolute top-2.5 right-2.5 w-7 h-7 inline-flex items-center justify-center rounded-md text-ink-300 hover:text-rose-600 hover:bg-rose-50 transition opacity-0 group-hover:opacity-100 focus:opacity-100" title="Delete entry"${idAttr} aria-label="Delete entry">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-1.5 pr-9">
          <span class="text-xs mono text-ink-500">${escapeHTML(formatTimestamp(e.timestamp))}</span>
          <span class="chip border ${badge}">${escapeHTML(e.type || "—")}</span>
          ${e.id ? `<span class="text-[11px] mono text-ink-300">${escapeHTML(e.id)}</span>` : ""}
        </div>
        <div class="font-semibold text-ink-900 break-words pr-9 leading-snug">${escapeHTML(e.title || "")}</div>
        ${messagesHTML}
      `;
      const btn = li.querySelector(".entry-delete");
      if (e.id) {
        btn.onclick = () => deleteEntry(e.id, e.title);
      } else {
        btn.disabled = true;
        btn.title = "Legacy entry without ID — cannot delete individually";
        btn.classList.add("cursor-not-allowed");
      }
      return li;
    }

    function renderEntries(entries) {
      const ul = $("#entries");

      if (!entries.length) {
        ul.innerHTML = "";
        rendered.clear();
        $("#empty").classList.remove("hidden");
        return;
      }
      $("#empty").classList.add("hidden");

      // Entries without an id (legacy) can't be diffed reliably — fall back
      // to the old wipe-and-rebuild path only for that case.
      if (entries.some((e) => !e.id)) {
        ul.innerHTML = "";
        rendered.clear();
        for (const e of entries) {
          const el = buildEntryEl(e);
          ul.appendChild(el);
        }
        return;
      }

      const wantIds = new Set(entries.map((e) => e.id));
      for (const [id, info] of rendered) {
        if (!wantIds.has(id)) {
          info.el.remove();
          rendered.delete(id);
        }
      }

      let prev = null;
      for (const e of entries) {
        const sig = entrySignature(e);
        let info = rendered.get(e.id);
        if (!info) {
          const el = buildEntryEl(e);
          info = { el, sig };
          rendered.set(e.id, info);
        } else if (info.sig !== sig) {
          const el = buildEntryEl(e);
          el.classList.remove("animate-fade-in");
          info.el.replaceWith(el);
          info.el = el;
          info.sig = sig;
        }
        const expected = prev ? prev.nextSibling : ul.firstChild;
        if (expected !== info.el) {
          ul.insertBefore(info.el, expected);
        }
        prev = info.el;
      }
    }

    function renderPager(page, totalPages) {
      const nav = $("#pager");
      nav.innerHTML = "";
      if (totalPages <= 1) return;
      const btn = (label, target, disabled, active) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.className = "min-w-[36px] h-9 px-3 rounded-lg border text-sm font-medium transition " +
          (active   ? "bg-ink-900 text-white border-ink-900 shadow-soft" :
           disabled ? "text-ink-300 border-ink-100 cursor-not-allowed bg-white" :
                      "bg-white border-ink-200 text-ink-700 hover:bg-ink-50");
        if (!disabled && !active) b.onclick = () => { state.page = target; load(); };
        return b;
      };
      nav.appendChild(btn("«", 1, page === 1, false));
      nav.appendChild(btn("‹", page - 1, page === 1, false));
      const start = Math.max(1, page - 2);
      const end = Math.min(totalPages, start + 4);
      for (let i = start; i <= end; i++) nav.appendChild(btn(String(i), i, false, i === page));
      nav.appendChild(btn("›", page + 1, page === totalPages, false));
      nav.appendChild(btn("»", totalPages, page === totalPages, false));
    }

    function populateTypes(types) {
      const sel = $("#filter-type");
      const current = state.type;
      sel.innerHTML = '<option value="">All</option>' +
        types.map((t) => `<option value="${escapeHTML(t)}"${t === current ? " selected" : ""}>${escapeHTML(t)}</option>`).join("");
    }

    function updateClearButton(total) {
      const btn = $("#clear");
      const filtered = state.type || state.q;
      const label = filtered ? `Delete ${total} matching` : "Delete all";
      btn.querySelector("svg")?.insertAdjacentHTML; // keep icon
      // Re-render label preserving icon
      btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>${escapeHTML(label)}`;
      btn.disabled = total === 0;
      btn.classList.toggle("opacity-50", total === 0);
      btn.classList.toggle("cursor-not-allowed", total === 0);
    }

    function buildFilterParams(url) {
      if (state.type) url.searchParams.set("type", state.type);
      if (state.q) url.searchParams.set("q", state.q);
    }

    function setStatus(text) { $("#status").textContent = text || ""; }

    async function load() {
      const url = new URL("/logs.json", window.location.origin);
      url.searchParams.set("page", state.page);
      url.searchParams.set("size", state.size);
      buildFilterParams(url);
      inflight++;
      setStatus("loading…");
      try {
        const res = await fetch(url);
        if (!res.ok) {
          $("#meta").textContent = "Failed to load logs: " + res.status;
          setStatus("error");
          return;
        }
        const data = await res.json();
        populateTypes(data.types || []);
        renderEntries(data.entries || []);
        renderPager(data.page, data.total_pages);
        updateClearButton(data.total || 0);
        $("#meta").innerHTML =
          `<span class="font-medium text-ink-700">${data.total}</span> entries · page ${data.page} of ${data.total_pages || 1}`;
        setStatus(`updated ${new Date().toLocaleTimeString()}`);
      } catch (err) {
        setStatus("error");
      } finally {
        inflight = Math.max(0, inflight - 1);
      }
    }

    async function deleteEntry(id, title) {
      const label = title ? `"${title.length > 60 ? title.slice(0, 60) + "…" : title}"` : "this entry";
      if (!window.confirm(`Delete ${label}?`)) return;
      const res = await fetch(`/logs/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!res.ok && res.status !== 404) {
        alert("Delete failed: " + res.status);
        return;
      }
      load();
    }

    async function deleteAll() {
      const filtered = state.type || state.q;
      const label = filtered
        ? `the ${$("#meta").textContent.match(/\d+/)?.[0] || ""} entries matching the current filter`.trim()
        : "ALL log entries";
      if (!window.confirm(`Delete ${label}? This cannot be undone.`)) return;
      const url = new URL("/logs", window.location.origin);
      buildFilterParams(url);
      const res = await fetch(url, { method: "DELETE" });
      if (!res.ok) {
        alert("Delete failed: " + res.status);
        return;
      }
      state.page = 1;
      load();
    }

    function setAutoRefresh(on) {
      const cb = $("#auto-refresh");
      const toggle = $("#auto-toggle");
      cb.checked = on;
      toggle.classList.toggle("on", on);
      $("#live-badge").classList.toggle("hidden", !on);
      if (timer) { clearInterval(timer); timer = null; }
      if (on) timer = setInterval(load, REFRESH_MS);
    }

    function exportCSV() {
      const url = new URL("/logs.csv", window.location.origin);
      buildFilterParams(url);
      // Navigating triggers the download; the response's
      // Content-Disposition header sets the filename.
      window.location.assign(url.toString());
    }

    $("#refresh").onclick = () => load();
    $("#export-csv").onclick = () => exportCSV();
    $("#clear").onclick = () => deleteAll();
    $("#filter-type").onchange = (e) => { state.type = e.target.value; state.page = 1; load(); };
    $("#filter-size").onchange = (e) => { state.size = parseInt(e.target.value, 10); state.page = 1; load(); };
    $("#filter-q").oninput = (e) => {
      const v = e.target.value;
      if (qTimer) clearTimeout(qTimer);
      qTimer = setTimeout(() => { state.q = v; state.page = 1; load(); }, 200);
    };
    $("#auto-refresh").onchange = (e) => setAutoRefresh(e.target.checked);

    // Pause auto-refresh when tab is hidden; resume when visible.
    document.addEventListener("visibilitychange", () => {
      const wantOn = $("#auto-refresh").checked;
      if (document.hidden) {
        if (timer) { clearInterval(timer); timer = null; }
      } else if (wantOn) {
        if (!timer) timer = setInterval(load, REFRESH_MS);
        load();
      }
    });

    // Boot: auto-refresh on by default at 2s.
    setAutoRefresh(true);
    load();
  </script>
</body>
</html>
