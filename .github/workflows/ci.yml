name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt: the following files need formatting:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  # auto-release fires when a PR merge to main bumped internal/version/VERSION
  # past the latest GitHub release tag. It validates the new tag, creates the
  # release pinned to this commit, then triggers the build workflow inline so
  # binaries get attached. We have to call release.yml directly via
  # workflow_call because GitHub does not fire release events for releases
  # created with the default GITHUB_TOKEN (anti-recursion safeguard).
  auto-release:
    name: Release if VERSION bumped
    needs: test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.maybe.outputs.released }}
      tag: ${{ steps.maybe.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release if VERSION differs from latest
        id: maybe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          raw=$(tr -d '[:space:]' < internal/version/VERSION)
          # Validate the in-code VERSION shape before stripping the prefix.
          ./scripts/check-version.sh "$raw"
          # Released tags and release names are unprefixed (0.5.0, not
          # v0.5.0), even though VERSION may carry the leading "v".
          # check-version.sh already treats the two forms as equivalent.
          tag=${raw#v}
          latest_raw=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          latest=${latest_raw#v}
          if [ "$tag" = "$latest" ]; then
            echo "VERSION ($raw) matches latest release ($latest_raw); nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "VERSION is $raw, latest release is '${latest_raw:-none}' — creating $tag"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build release binaries
    needs: auto-release
    if: needs.auto-release.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.auto-release.outputs.tag }}
