name: Release binaries

# Two entry points:
#   release: published — manual GitHub release flow
#   workflow_call      — invoked by ci.yml after auto-creating a release
#                        from a VERSION bump (GITHUB_TOKEN-created releases
#                        don't fire release events, so we call directly).
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to verify and attach binaries to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check-version:
    name: Verify release tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare tag to internal/version/VERSION
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: ./scripts/check-version.sh "$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run version package tests
        run: go test ./internal/version/...

  build:
    name: Build ${{ matrix.asset }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            asset: temporal-macos-arm64
            runner: macos-14
          - goos: darwin
            goarch: amd64
            asset: temporal-macos-x86_64
            runner: macos-14
          - goos: linux
            goarch: amd64
            asset: temporal-linux-x86_64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            asset: temporal-linux-arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.asset }} .

      - name: Generate SHA256 checksum
        run: shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
